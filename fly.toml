# fly launch will fill in `app`; keep the rest.
primary_region = "bos"

[build]

[env]
  DATABASE_URL = "file:/data/marine.db"
  UPLOAD_DIR = "/data/uploads"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
